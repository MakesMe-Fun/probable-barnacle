# 사용자 관심사 설정
#
# keywords: 이벤트의 title/details/entities와 매칭해 개인화 점수를 올리는 키워드
# weight: 키워드별 가중치 (기본 1.0, 특히 더 보고 싶은 주제는 높게)
#
# 이 파일은 MVP에서는 정적으로 사용되지만, 향후 interaction_log 데이터가
# 쌓이면 자동으로 가중치를 조정하는 "관심사 자동 학습" 기능이 이 파일 대신
# (혹은 이 파일을 기본값으로 삼아) DB 기반 가중치로 전환될 예정입니다.

interests:
  - keyword: "AI"
    weight: 1.5
    aliases: ["인공지능", "에이아이"]
  - keyword: "LLM"
    weight: 1.5
    aliases: ["거대언어모델", "언어모델", "생성형 AI", "생성형 인공지능"]
  - keyword: "OpenAI"
    weight: 1.5
    aliases: ["오픈AI", "오픈에이아이", "챗GPT", "ChatGPT", "챗지피티"]
  - keyword: "Anthropic"
    weight: 1.5
    aliases: ["앤스로픽", "앤트로픽", "클로드", "Claude"]
  - keyword: "Google"
    weight: 1.2
    aliases: ["구글", "제미나이", "Gemini", "알파벳", "딥마인드", "DeepMind"]
  - keyword: "NVIDIA"
    weight: 1.4
    aliases: ["엔비디아", "젠슨 황", "GPU", "지포스"]
  - keyword: "미국 정책"
    weight: 1.2
    aliases: ["트럼프", "Trump", "연준", "Fed", "관세", "백악관"]
  - keyword: "캐나다 이민"
    weight: 1.3
    aliases: ["캐나다 영주권", "캐나다 비자", "이민 정책"]
  - keyword: "반도체"
    weight: 1.4
    aliases: ["HBM", "파운드리", "메모리 반도체", "삼성전자", "SK하이닉스",
              "TSMC", "칩", "웨이퍼"]
  - keyword: "경제"
    weight: 1.0
    aliases: ["금리", "환율", "물가", "인플레이션", "코스피", "증시", "부동산"]

# 신뢰도 낮은(low) 소스로만 구성된 이벤트를 "그 외 주요 이슈"에서 제외할지 여부.
# 관심사 키워드에 걸린 이벤트에는 이 필터를 적용하지 않는다
# (관심 키워드는 소스가 약해도 빠짐없이 보는 게 목적이므로).
exclude_low_reliability_only_from_top: true

# 개수 상한. 기본은 둘 다 null = 제한 없음이다.
# "오늘 이슈가 많은 날"에 볼 게 잘려나가지 않도록, 무엇을 볼지는 개수가 아니라
# 기준(키워드 매칭 / 신뢰도)으로만 정한다. 숫자를 넣으면 그만큼에서 자르고
# 잘린 사실을 로그에 남긴다. API 한도에 자꾸 걸릴 때만 쓸 것.
max_interest_events: null   # 관심 키워드에 걸린 이벤트
top_general_events: null    # 키워드엔 안 걸렸지만 중요한 이벤트

# Discord 알림으로 보낼 최대 건수. null이면 전부 보냅니다(기본).
# 폰에서는 HTML 리포트를 열기가 번거로우므로 알림 자체가 원본이어야 합니다.
# 알림이 너무 많다 싶으면 숫자를 넣으세요 (예: 30).
# 어느 쪽이든 전체 리포트 HTML은 첫 메시지에 파일로 첨부됩니다.
discord_max_events: null
